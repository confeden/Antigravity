name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.35.1). Empty = v<Cargo.toml version>."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      full_ver: ${{ steps.meta.outputs.full_ver }}
      cargo_ver: ${{ steps.meta.outputs.cargo_ver }}
      asset_ver: ${{ steps.meta.outputs.asset_ver }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          set -eu
          if [ "${REF#refs/tags/}" != "$REF" ]; then
            TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            TAG="v$VER"
          fi
          FULL_VER="${TAG#v}"
          CARGO_VER=$(printf '%s' "$FULL_VER" | cut -d'_' -f1 | awk -F. '{print $1"."$2"."$3}')
          ASSET_VER=$(printf '%s' "$FULL_VER" | sed -E 's/\.([0-9]+)$/_\1/')
          {
            echo "tag=$TAG"
            echo "full_ver=$FULL_VER"
            echo "cargo_ver=$CARGO_VER"
            echo "asset_ver=$ASSET_VER"
          } >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: win-x64
      - name: Sync version and optional secrets
        shell: bash
        env:
          CARGO_VER: ${{ needs.prepare.outputs.cargo_ver }}
          EXITS_RS: ${{ secrets.EXITS_RS }}
          EXITS: ${{ secrets.EXITS }}
          RELAY_RS: ${{ secrets.RELAY_RS }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          GROUP: ${{ secrets.GROUP }}
        run: |
          set -eu
          sed "s/^version = \".*\"/version = \"$CARGO_VER\"/" Cargo.toml > Cargo.toml.tmp && mv Cargo.toml.tmp Cargo.toml
          decode() { [ -n "${1:-}" ] && printf '%s' "$1" | base64 --decode > "$2" || true; }
          decode "$EXITS_RS" src/exits.rs
          decode "$EXITS" .exits
          decode "$RELAY_RS" src/relay.rs
          decode "$RELAY_KEY" .relay_key
          decode "$GROUP" .group
          if [ -f src/relay.rs ] && [ -f .relay_key ]; then
            echo "AG_WITH_RELAY=1" >> "$GITHUB_ENV"
          fi
      - name: Build Windows binary
        shell: bash
        env:
          AG_FULL_VERSION: ${{ needs.prepare.outputs.full_ver }}
          AG_UPDATE_REPO: ${{ github.repository }}
          ASSET_VER: ${{ needs.prepare.outputs.asset_ver }}
        run: |
          set -eu
          cargo build --release --bin ag_unlocker
          mkdir -p release
          cp target/release/ag_unlocker.exe "release/AG_${ASSET_VER}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-asset
          path: release/AG_*.exe
          if-no-files-found: error

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup set profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x64
      - name: Sync version and optional secrets
        env:
          CARGO_VER: ${{ needs.prepare.outputs.cargo_ver }}
          EXITS_RS: ${{ secrets.EXITS_RS }}
          EXITS: ${{ secrets.EXITS }}
          RELAY_RS: ${{ secrets.RELAY_RS }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          GROUP: ${{ secrets.GROUP }}
        run: |
          set -eu
          sed "s/^version = \".*\"/version = \"$CARGO_VER\"/" Cargo.toml > Cargo.toml.tmp && mv Cargo.toml.tmp Cargo.toml
          decode() { [ -n "${1:-}" ] && printf '%s' "$1" | base64 --decode > "$2" || true; }
          decode "$EXITS_RS" src/exits.rs
          decode "$EXITS" .exits
          decode "$RELAY_RS" src/relay.rs
          decode "$RELAY_KEY" .relay_key
          decode "$GROUP" .group
          if [ -f src/relay.rs ] && [ -f .relay_key ]; then
            echo "AG_WITH_RELAY=1" >> "$GITHUB_ENV"
          fi
      - name: Build Linux bundle
        env:
          AG_FULL_VERSION: ${{ needs.prepare.outputs.full_ver }}
          AG_UPDATE_REPO: ${{ github.repository }}
          ASSET_VER: ${{ needs.prepare.outputs.asset_ver }}
        run: |
          set -eu
          cargo build --release --bin ag_unlocker
          NAME="AG_${ASSET_VER}_linux"
          mkdir -p "release/$NAME"
          cp target/release/ag_unlocker "release/$NAME/ag_unlocker"
          chmod +x "release/$NAME/ag_unlocker"
          for f in launch.sh install.sh Antigravity-Unlocker.desktop README.md; do
            [ -f "linux/$f" ] && cp "linux/$f" "release/$NAME/$f"
          done
          chmod +x "release/$NAME/launch.sh" "release/$NAME/install.sh"
          tar -C release -czf "release/${NAME}.tar.gz" "$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-asset
          path: release/AG_*_linux.tar.gz
          if-no-files-found: error
  build-macos:
    needs: prepare
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup set profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64
      - name: Sync version and optional secrets
        env:
          CARGO_VER: ${{ needs.prepare.outputs.cargo_ver }}
          EXITS_RS: ${{ secrets.EXITS_RS }}
          EXITS: ${{ secrets.EXITS }}
          RELAY_RS: ${{ secrets.RELAY_RS }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          GROUP: ${{ secrets.GROUP }}
        run: |
          set -eu
          sed "s/^version = \".*\"/version = \"$CARGO_VER\"/" Cargo.toml > Cargo.toml.tmp && mv Cargo.toml.tmp Cargo.toml
          decode() { [ -n "${1:-}" ] && printf '%s' "$1" | base64 --decode > "$2" || true; }
          decode "$EXITS_RS" src/exits.rs
          decode "$EXITS" .exits
          decode "$RELAY_RS" src/relay.rs
          decode "$RELAY_KEY" .relay_key
          decode "$GROUP" .group
          if [ -f src/relay.rs ] && [ -f .relay_key ]; then
            echo "AG_WITH_RELAY=1" >> "$GITHUB_ENV"
          fi
      - name: Build macOS bundle
        env:
          AG_FULL_VERSION: ${{ needs.prepare.outputs.full_ver }}
          AG_UPDATE_REPO: ${{ github.repository }}
          ASSET_VER: ${{ needs.prepare.outputs.asset_ver }}
        run: |
          set -eu
          cargo build --release --bin ag_unlocker --target aarch64-apple-darwin
          BIN=target/aarch64-apple-darwin/release/ag_unlocker
          codesign --force --sign - "$BIN"
          NAME="AG_${ASSET_VER}_macos"
          mkdir -p "release/$NAME"
          cp "$BIN" "release/$NAME/ag_unlocker"
          chmod +x "release/$NAME/ag_unlocker"
          [ -f linux/README.md ] && cp linux/README.md "release/$NAME/README.md" || true
          cat > "release/$NAME/Запустить.command" <<'SH'
          #!/bin/sh
          cd "$(dirname "$0")"
          xattr -dr com.apple.quarantine ag_unlocker 2>/dev/null || true
          exec ./ag_unlocker "$@"
          SH
          chmod +x "release/$NAME/Запустить.command"
          tar -C release -czf "release/${NAME}.tar.gz" "$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-asset
          path: release/AG_*_macos.tar.gz
          if-no-files-found: error

  publish:
    needs: [prepare, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -eu
          cd dist
          sha256sum AG_* > SHA256SUMS.txt
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" ./* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" ./* --target "${{ github.sha }}" --title "Release $TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
