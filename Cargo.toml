[package]
name = "ag_unlocker"
version = "2.11.0"
edition = "2021"
description = "Antigravity Configuration Tool"
authors = ["Brent t.me/nova_txt"]

[dependencies]
obfstr = "0.4"
sha2 = "0.10"
hex = "0.4"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"
# Decrypts the relay credential baked in by build.rs (owner build only; the
# private src/relay.rs is the only user).
aes-gcm = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
# build.rs derives the per-release canary with the same formula as canary.rs.
sha2 = "0.10"
hex = "0.4"
# Encrypt the relay credential into the binary with a random per-build key.
aes-gcm = "0.10"
getrandom = "0.2"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
# LTO off by request (faster builds). The release exe is UPX-compressed in place
# by build_rust.py, so final on-disk size is dominated by the packer, not LTO.
# Note: turning LTO back on would shrink the (pre- and post-pack) binary a little
# further and does NOT affect startup - flip if size matters more than build time.
lto = false
codegen-units = 1
panic = "abort"
strip = true

